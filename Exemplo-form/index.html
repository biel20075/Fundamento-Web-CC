<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo formulário html</title>
</head>
<body>
    <header>
        <h3>Formulário e Inputs</h3>
    </header>
    <main>
        <form id="registerForm" method="POST">
            <label for="nome"> Nome Completo: </label>
            <input type="text" id="nome" name="nome" placeholder="Digite Nome" required/>
            <br>
            <br>
            <label for="email">Endereço de e-mail: </label>
            <input type="email" id="email" name="email" placeholder="Digite e-mail" required/>
            <br>
            <br>
            <label for="senha"> Informe a sua senha: </label>
            <input type="password" id="senha" name="senha" placeholder="Digite senha" required minlength="8" title="A senha deve ter no minimo 8 caracteres"/>
            <br>
            <br>
            <label for="mensagem" >Informe sua mensagem: </label>
            <br>
            <textarea id="mensagem" name="mensagem" rows="4" cols="30"></textarea>
            <br>
            <br>
            <label for="evento">Selecione o evento escolhido: </label>
            <br>
            <!-- tag de seletor, ao slecionar uma das opções do value da option é atribuido ao name do select -->
            <!-- key:value -->
            <!-- evento:teatro -->
            <select id="evento" name="evento">
                <option value="rock">Show de Rock</option>
                <option value="modao">Show de Sertanejo</option>
                <option value="teatro">Teatro: Comédia</option>

            </select>
            <br>
            <br>
            <!-- <input checkbox -> Opção de multipla escolha -->
             <label for="termos">
                <input type="checkbox" id="termos" name="termos" required/>
                Aceito os termos de uso
             </label>
            <br>
            <br>
            <!-- Input type radio - Escolha única -->
            <label><input type="radio" name="pagamento" value="pix"/>Pix</label>
            <label><input type="radio" name="pagamento" value="cartao"/>Cartão</label>
            <br>
            <br>
            <input type="date"/>
            <br>
            <br>
            <input type="file"/>
            <br>
            <br>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato esperado: 000.000.000-00"/>
             <!-- Para o type radio funcionar ambos os inputs devem compartilhar o mesmo name -->
            <br>
            <br>
            <input type="submit" value="Cadastrar"/>
            <button type="button" onclick="">Cancelar</button>
            
        </form>
    </main>
    <footer>
        <p>Desenvolvido por Gabriel</p>
    </footer>
    
    <script>
        document.getElementById('registerForm').addEventListener('submit',function(event)
        {
            event.preventDefault(); // impede o comportamento padrão de envio do formuçário (recarregamento)
            const nome = document.getElementById('nome').value;
            alert('Ola, '+nome+', cadastro enviado com sucesso');
        })
    </script>
</body>
</html>
